[package]
name = "cairn-extraction"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2.0.19"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
dotenvy = "0.15.7"
